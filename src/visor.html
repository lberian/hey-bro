<style>

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }

.c3 { --pc: var(--p3); } .c4 { --pc: var(--p4); } .c5 { --pc: var(--p5); }

.barra { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }

.sala { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.sala-cab { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); background: var(--surface); display: grid; gap: 10px; }
.sala-cab-fila { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.sala-cab h1 { margin: 0; font-size: 19px; line-height: 1.25; }
.sala-cab .obj { margin: 4px 0 0; color: var(--text-2); max-width: 70ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px; background: var(--sunken); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

.chip.mono { font-family: var(--mono); }

.medidor i { display: block; height: 100%; background: var(--accent); }
.acciones { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--border-strong); background: var(--surface-2); padding: 6px 11px; border-radius: 8px; font-size: 13px; color: var(--text); white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; }
.btn:hover:not(:disabled) { border-color: var(--text-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

.msg { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--pc, var(--border-strong)); border-radius: var(--radius); padding: 10px 14px 12px; box-shadow: var(--shadow); max-width: 920px; }
.msg-cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }

.origen, .por-defecto { border-left: 3px solid var(--border-strong); margin: 6px 0; padding: 4px 10px; color: var(--text-2); background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 13px; }
.por-defecto { border-left-color: var(--accent); }

.e-sala { align-self: stretch; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; max-width: 920px; }
.e-sala::before, .e-sala::after { content: ""; flex: 1; border-top: 1px solid var(--border); }

.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }

.md pre code { background: none; padding: 0; }

.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow: auto; }

.composer { border-top: 1px solid var(--border); background: var(--surface); padding: 10px 20px 14px; display: grid; gap: 8px; }
.composer-fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.composer select { border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: 7px; padding: 4px 8px; }
.composer .ayuda { font-size: 12px; color: var(--muted); }
.composer textarea, .respuesta textarea { flex: 1; min-width: 200px; resize: vertical; min-height: 44px; max-height: 240px; border: 1px solid var(--border-strong); border-radius: 9px; padding: 10px 12px; background: var(--surface-2); }
.composer textarea:focus, .respuesta textarea:focus { background: var(--surface); }
.aviso-envio { font-size: 12.5px; color: var(--danger); }

.panel { border-left: 1px solid var(--border); background: var(--surface-2); display: flex; flex-direction: column; min-height: 0; }
.pestanas { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--border); }

.pestanas button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.pestanas .num { font-weight: 500; color: var(--muted); margin-left: 4px; }
.panel-cuerpo { overflow: auto; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; flex: 1; }

.herm-cab .nom b { display: block; line-height: 1.2; }
.herm-cab .nom small { color: var(--muted); font-size: 12px; }
.presencia { font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; }
.presencia::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
.presencia.escuchando { color: var(--ok); } .presencia.escuchando::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.presencia.activo { color: var(--info); } .presencia.activo::before { background: var(--info); }

.herm dl { margin: 6px 0 0; display: grid; gap: 6px; font-size: 12.5px; }
.herm dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.herm dd { margin: 0; color: var(--text); white-space: pre-wrap; }
.grupo h4 { margin: 4px 2px 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.item { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; display: grid; gap: 4px; font-size: 13px; }
.item + .item { margin-top: 6px; }
.item .fila { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.item .tit { font-weight: 600; line-height: 1.35; word-break: break-word; }

.modal { position: fixed; inset: 0; background: rgba(15, 10, 5, .45); display: grid; place-items: center; padding: 20px; z-index: 20; }

.asunto { border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 10px 12px; background: var(--surface-2); display: grid; gap: 6px; }

.asunto .cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.asunto .cab b { color: var(--text); }

.solo-estrecho { display: none; }
@media (max-width: 1180px) {
  .app { grid-template-columns: 240px minmax(0, 1fr); }
  .panel { position: fixed; right: 0; top: 52px; bottom: 0; width: min(380px, 92vw); z-index: 10; box-shadow: -10px 0 30px rgba(0, 0, 0, .18); transform: translateX(105%); transition: transform .18s ease; }

}

function el(tag, attrs, ...hijos) {

      tabla.append(tb); frag.append(tabla); continue;
    }
    if (RE_LISTA.test(l)) {
      const ord = /^\s*\d+[.)]/.test(l);
      const lista = el(ord ? 'ol' : 'ul');
      while (i < L.length && RE_LISTA.test(L[i])) { lista.append(el('li', {}, inline(L[i].replace(RE_LISTA, '')))); i++; }
      frag.append(lista); continue;
    }
    const buf = [];
    while (i < L.length && !/^\s*$/.test(L[i]) && !/^\s*```/.test(L[i]) && !/^\s*#{1,6}\s/.test(L[i]) && !RE_LISTA.test(L[i]) && !/^\s*>/.test(L[i])) buf.push(L[i++]);
    const p = el('p');
    buf.forEach((b, k) => { if (k) p.append(el('br')); p.append(...inline(b)); });
    frag.append(p);
  }
  return frag;
}

async function cargarSala() {
  if (!E.sala || E.cargando) return;
  E.cargando = true;
  const id = E.sala;
  try {
    const j = await api(`/api/salas/${id}?desde=${E.ultimoN}`);
    if (id !== E.sala) return;
    conexion(true);
    E.datos = j;
    j.participantes.forEach((p) => color(p.nombre));
    const nuevas = j.entradas.filter((e) => e.n > E.ultimoN);
    if (nuevas.length) { E.entradas.push(...nuevas); E.ultimoN = nuevas[nuevas.length - 1].n; }
    pintarCabecera(); pintarHermanos(); pintarTablero(); anexar(nuevas);
    if (document.hidden) {
      E.noLeidos += nuevas.filter((e) => e.tipo === 'mensaje' && e.clase !== 'bitacora').length;
      actualizarTitulo();
    }
  } catch (e) {

      el('div', {}, x.texto),
      el('div', { class: 'respuesta' },
        el('button', { class: 'btn pequeno', type: 'button', onclick: async (ev) => { try { await navigator.clipboard.writeText(x.invitacion || ''); ev.target.textContent = TX.copiada; } catch { /* nada */ } } }, TX.copiar),
        el('button', { class: 'btn pequeno', type: 'button', onclick: () => seleccionar(x.sala) }, TX.irASala))))));
  }
}
async function responderBandeja(x, texto) {
  try { await post(`/api/salas/${x.sala}/mensaje`, { texto, para: x.de, resuelve: [x.n] }); await cargarBandeja(); pintarBandeja(); if (E.sala === x.sala) cargarSala(); }
  catch (e) { aviso(e.message); }
}
async function accionBandeja(x) {
  try { await post(`/api/salas/${x.sala}/accion`, { accion: 'resolver', ref: x.n }); await cargarBandeja(); pintarBandeja(); }
  catch (e) { aviso(e.message); }
}
function abrirBandeja() {
  $('#modal').dataset.modo = 'bandeja';
  $('#modalTitulo').textContent = TX.bandejaTitulo;
  pintarBandeja();
  $('#modal').hidden = false;
  $('#modalCerrar').focus();
}

async function verDossier(nombre) {
  try {
    const j = await api(`/api/salas/${E.sala}/dossier?de=${encodeURIComponent(nombre)}`);
    $('#modal').dataset.modo = 'dossier';
    $('#modalTitulo').textContent = TX.dossierDe(j.nombre, j.dossier.version, hora(j.dossier.t));
    $('#modalCuerpo').classList.add('md');
    $('#modalCuerpo').replaceChildren(md(j.dossier.texto || TX.vacio));
    $('#modal').hidden = false;
    $('#modalCerrar').focus();
  } catch (e) { aviso(e.message); }
}
function cerrarModal() { $('#modal').hidden = true; $('#modal').dataset.modo = ''; }
function aviso(t) { $('#avisoEnvio').textContent = t || ''; if (t) setTimeout(() => { if ($('#avisoEnvio').textContent === t) $('#avisoEnvio').textContent = ''; }, 6000); }

// ── acciones ──
async function accion(nombre, extra) {
  try { await post(`/api/salas/${E.sala}/accion`, { accion: nombre, ...extra }); await cargarSala(); await cargarSalas(); }
  catch (e) { aviso(e.message); }
}
$('#accPausar').addEventListener('click', () => accion(E.datos?.estado === 'pausada' ? 'reanudar' : 'pausar'));
$('#accAmpliar').addEventListener('click', () => accion('ampliar', { cantidad: 10 }));
$('#accPermanente').addEventListener('click', () => accion(E.datos?.permanente ? 'temporal' : 'permanente'));
let temporizadorCerrar = null;
$('#accCerrar').addEventListener('click', (ev) => {
  const b = ev.currentTarget;
  if (E.datos?.estado === 'cerrada') { accion('reabrir'); return; }
  if (!b.classList.contains('confirmar')) {
    b.classList.add('confirmar'); b.textContent = TX.seguro;
    temporizadorCerrar = setTimeout(() => { b.classList.remove('confirmar'); pintarCabecera(); }, 4000);
    return;
  }
  clearTimeout(temporizadorCerrar); b.classList.remove('confirmar'); accion('cerrar');
});
$('#copiarInvitacion').addEventListener('click', async () => {
  const t = $('#invitacionTexto').textContent;
  try { await navigator.clipboard.writeText(t); $('#copiarInvitacion').textContent = TX.copiada; }
  catch { const r = document.createRange(); r.selectNodeContents($('#invitacionTexto')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('#copiarInvitacion').textContent = TX.seleccionaCopia; }
  setTimeout(() => { $('#copiarInvitacion').textContent = TX.copiarInvitacion; }, 2500);
});
$('#composer').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const texto = $('#texto').value.trim();
  if (!texto || !E.sala) return;
  $('#btnEnviar').disabled = true;
  try {
    await post(`/api/salas/${E.sala}/mensaje`, { texto, para: $('#para').value || null });
    $('#texto').value = ''; aviso('');
    await cargarSala();
    const hilo = $('#hilo'); hilo.scrollTop = hilo.scrollHeight;
  } catch (e) { aviso(e.message); }
  finally { $('#btnEnviar').disabled = E.datos?.estado === 'cerrada'; }
});
$('#texto').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); $('#composer').requestSubmit(); } });
$('#verCerradas').addEventListener('change', pintarSalas);
$('#verBitacora').addEventListener('change', (ev) => $('#hilo').classList.toggle('sin-bitacora', !ev.target.checked));
$('#verEventos').addEventListener('change', (ev) => $('#hilo').classList.toggle('sin-eventos', !ev.target.checked));
function pestana(cual) {
  $('#tabHermanos').setAttribute('aria-selected', String(cual === 'hermanos'));
  $('#tabTablero').setAttribute('aria-selected', String(cual === 'tablero'));
  $('#panelHermanos').hidden = cual !== 'hermanos';
  $('#panelTablero').hidden = cual !== 'tablero';
}
$('#tabHermanos').addEventListener('click', () => pestana('hermanos'));
$('#tabTablero').addEventListener('click', () => pestana('tablero'));
$('#btnPanel').addEventListener('click', () => $('#panel').classList.toggle('abierto'));
$('#btnBandeja').addEventListener('click', abrirBandeja);
$('#modalCerrar').addEventListener('click', cerrarModal);
$('#modal').addEventListener('click', (ev) => { if (ev.target.id === 'modal') cerrarModal(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { cerrarModal(); $('#panel').classList.remove('abierto'); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { E.noLeidos = 0; actualizarTitulo(); } });
window.addEventListener('hashchange', () => { const h = decodeURIComponent(location.hash.slice(1)); if (h && h !== E.sala) seleccionar(h); });

// ── tema ──
const TEMAS = ['auto', 'claro', 'oscuro'];
function aplicarTema(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-tema'); else document.documentElement.setAttribute('data-tema', t);
}
let tema = 'auto';
try { tema = localStorage.getItem('heybro-tema') || 'auto'; } catch { /* nada */ }
aplicarTema(tema);
$('#btnTema').addEventListener('click', () => {
  tema = TEMAS[(TEMAS.indexOf(tema) + 1) % TEMAS.length];
  aplicarTema(tema);
  try { localStorage.setItem('heybro-tema', tema); } catch { /* nada */ }
});

// ── arranque ──
conexion(true);
api('/api/ping').then((j) => { $('#pieSalas').textContent = TX.carpeta(j.carpeta, j.version); }).catch(() => {});
cargarSalas();
cargarBandeja();
setInterval(cargarSalas, 4000);
setInterval(cargarSala, 1500);
setInterval(cargarBandeja, 5000);
</script>
</body>
</html>
