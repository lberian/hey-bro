name: release

# Push a tag like v0.2.0 to build the extension and the skills and attach them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.mcpb
            dist/*.zip
          generate_release_notes: true
